name: Scrape jobs

on:
  schedule:
    # Runs daily at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobs

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Token with write access so the commit step can push back.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: jobs/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        # Needed by scrapers/_browser.py (HDR's JS-rendered Taleo board).
        run: python -m playwright install --with-deps chromium

      - name: Run pipeline
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          # Optional: enables the LLM location fallback in scrapers/_location.py.
          # Unset -> the pipeline still runs, just without LLM location recovery.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipeline.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage the JSON data (in jobs/) plus the generated markdown at the
          # repo root. Steps run from jobs/, so root files are one level up.
          git add data/*.json ../README.md ../ARCHITECTURE.md ../PSYCHOLOGY.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update job listings [skip ci]"
            git push
          fi
